# =============================================================================
# ECO-REWIND: Master Configuration  (v3 — learning fixes)
# =============================================================================
# KEY CHANGES vs v2:
#   - lambda_temporal: 0.05 → 0.20  (loss scale corrected in losses.py v4,
#     auxiliary losses need higher weight to contribute meaningful gradient)
#   - lambda_ecological: 0.05 → 0.10
#   - lambda_ssim: 0.00 → 0.10 (re-enabled; ssim_warmup_epochs=20 still applies)
#   - sync_checkpoints_to_drive: true → false (was causing permission errors)
#   - patience: 25 → 30 (give models more time with corrected loss scale)
# =============================================================================

project:
  name: "eco-rewind"
  version: "1.3.0"

# =============================================================================
# DATA PATHS
# =============================================================================
data:
  mode: "local"
  gdrive_root: "/content/drive/MyDrive/EcoRewind"
  local_root: "/home/CL502-17/Desktop/Kunal_IDL_V1/EcoRewind_Data"
  processed_dir: "./processed"
  metadata_file: "pipeline_metadata_v2.json"
  file_extension: ".tif"

# =============================================================================
# ECOSYSTEM DEFINITIONS
# =============================================================================
ecosystems:
  everglades:
    name: "Everglades"
    folder: "Everglades"
    n_composites: 32
    start_year: 2016
    start_quarter: 1
    t_event: 6
    hurricane: "Irma"
    hurricane_year: 2017
    hurricane_quarter: 3
    poor_quarters:
      - {year: 2016, quarter: 3}
      - {year: 2018, quarter: 3}
      - {year: 2019, quarter: 3}
      - {year: 2020, quarter: 3}
      - {year: 2021, quarter: 3}
    fair_quarters:
      - {year: 2016, quarter: 4}
    interpolated_quarters:
      - {year: 2017, quarter: 2}

  mississippi:
    name: "Mississippi"
    folder: "Mississippi_v2"
    n_composites: 32
    start_year: 2016
    start_quarter: 1
    t_event: 23
    hurricane: "Ida"
    hurricane_year: 2021
    hurricane_quarter: 4
    poor_quarters: []
    fair_quarters: []
    interpolated_quarters:
      - {year: 2016, quarter: 2}
    version: "v2"
    ndvi_mean_threshold: 0.10

# =============================================================================
# BAND DEFINITIONS
# =============================================================================
bands:
  names: ["Blue", "Green", "Red", "NIR", "NDVI", "NDWI", "SAR_VV"]
  count: 7
  indices:
    blue: 0
    green: 1
    red: 2
    nir: 3
    ndvi: 4
    ndwi: 5
    sar_vv: 6

  normalization:
    blue:   "minmax"
    green:  "minmax"
    red:    "minmax"
    nir:    "minmax"
    ndvi:   "shift"
    ndwi:   "shift"
    sar_vv: "zscore"

  valid_ranges:
    blue:   [0.0, 1.0]
    green:  [0.0, 1.0]
    red:    [0.0, 1.0]
    nir:    [0.0, 1.0]
    ndvi:   [-1.0, 1.0]
    ndwi:   [-1.0, 1.0]
    sar_vv: [-30.0, 5.0]

# =============================================================================
# PATCH SAMPLING
# =============================================================================
patches:
  size: 128
  stride: 64
  nan_threshold: 0.15

  use_validity_mask: true
  min_valid_coverage: 0.30
  use_soft_mask: false
  ndvi_var_threshold: 5.0e-4
  min_high_signal_frac: 0.40

# =============================================================================
# MODEL SETTINGS
# =============================================================================
model:
  architecture: "unet_temporal"
  t_input: 4
  t_output: 4

  convlstm:
    hidden_channels: [96, 96, 64]
    kernel_size: 3
    dropout: 0.1

  unet_temporal:
    encoder_channels: [32, 64, 128, 256]
    lstm_hidden: 512
    n_attention_heads: 8
    dropout: 0.1

  eco_transformer:
    embed_dim: 128
    depth: 4
    n_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1

  unet_mamba:
    encoder_channels: [32, 64, 128, 256]
    mamba_d_state: 16
    mamba_expand: 2
    n_mamba_layers: 2
    dropout: 0.15

  unet_patchtst:
    encoder_channels: [32, 64, 128, 256]
    patch_len: 2
    stride: 1
    n_transformer_layers: 3
    n_heads: 4
    mlp_ratio: 2.0
    dropout: 0.15

# =============================================================================
# LOSS FUNCTION  (v4 fixes — scale-corrected lambdas)
# =============================================================================
loss:
  # With losses.py v4, reconstruction loss is now ~0.3 (per-pixel scale).
  # Auxiliary losses need higher lambdas to contribute meaningful gradients.
  lambda_temporal:    0.20   # was 0.05 — temporal smoothness now ~5% of total
  lambda_ecological:  0.10   # was 0.05 — eco constraints now ~2% of total
  lambda_ssim:        0.10   # was 0.00 — re-enabled after warmup
  lambda_spectral:    0.00
  ssim_warmup_epochs: 20     # SSIM phases in linearly over first 20 epochs

# =============================================================================
# TRAINING
# =============================================================================
training:
  epochs: 150
  batch_size: 4
  learning_rate: 0.00003
  weight_decay: 0.00001
  patience: 30              # was 25 — give models more time with correct loss
  grad_clip: 1.0
  warmup_epochs: 15
  gradient_accumulation_steps: 4
  use_augmentation: true
  train_on: joint

  lr_overrides:
    unet_mamba:    1.0e-5
    unet_patchtst: 2.0e-5

  ecosystems_for_training:
    everglades: true
    mississippi: true

  window_mode: "all"
  balanced_sampling: true
  save_every_n_epochs: 5
  keep_best_n: 3
  sync_checkpoints_to_drive: false   # was true — /content not mounted locally
  checkpoint_drive_path: "/content/drive/MyDrive/EcoRewind/checkpoints"

# =============================================================================
# WEIGHTS & BIASES
# =============================================================================
wandb:
  enabled: true
  project: "eco-rewind"
  entity: null

# =============================================================================
# OUTPUT PATHS
# =============================================================================
outputs:
  base_dir: "./outputs"
  checkpoints: "./outputs/checkpoints"
  logs: "./outputs/logs"
  maps: "./outputs/maps"
  metrics: "./outputs/metrics"

# =============================================================================
# INFERENCE / COUNTERFACTUAL
# =============================================================================
inference:
  impact_threshold: 0.05
  carbon_factor: 85.0
  convergence_ci: 0.95
  mc_dropout_samples: 50
  climatology_anchor: true
  climatology_sigma: 2.0