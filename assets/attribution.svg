<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Carbon-loss attribution varies more than 20x across backbones">
<title>Carbon-loss attribution varies more than 20x across backbones</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#0E1628"/>
</linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0F1830"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#22304F" stroke-width="1" opacity=".38"/>
</pattern>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

</defs>
<style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .h1 { fill:#E8EEF9; font-weight:700; }
  .h2 { fill:#E8EEF9; font-weight:650; }
  .lb { fill:#A9BAD8; font-weight:500; }
  .mu { fill:#7286AB; font-weight:500; }
  .kicker { fill:#7286AB; font-weight:600; letter-spacing:.16em; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
.grow{transform:scaleX(0);transform-origin:left;animation:gw 1.1s cubic-bezier(.3,1,.4,1) forwards}
@keyframes gw{to{transform:scaleX(1)}} .pp{animation:pp 3s ease-in-out infinite}@keyframes pp{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<rect width="1200" height="500" rx="18" fill="url(#bg)"/>
<rect width="1200" height="500" rx="18" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="499" rx="18" fill="none" stroke="#2E3F66"/>
<text x="38" y="44" class="kicker" font-size="12">THE HEADLINE FINDING — AND IT IS A NEGATIVE ONE</text>
<text x="36" y="76" class="h1" font-size="23">Same data, same pipeline: the backbone picks the answer</text>
<text x="38" y="99" class="mu" font-size="12">Estimated carbon-stock loss (tCO₂-equivalent), log scale. Identical inputs; only the architecture differs.</text>
<line x1="330.0" y1="118" x2="330.0" y2="384" stroke="#22304F" opacity=".6"/>
