<g class="grow" style="animation-delay:0.00s"><line x1="330" y1="160" x2="486.0" y2="160" stroke="#3987e5" stroke-width="3" stroke-linecap="round" opacity=".38"/></g>
<circle cx="486.0" cy="160" r="6" fill="#3987e5" stroke="#0E1628" stroke-width="2"/>
<text x="314" y="164" class="lb" font-size="11.5" text-anchor="end">EcoTransformer</text>
<text x="500.0" y="164" class="mono h2" font-size="11.5" fill="#3987e5">50,332</text>
<g class="grow" style="animation-delay:0.12s"><line x1="330" y1="184" x2="420.3" y2="184" stroke="#c98500" stroke-width="3" stroke-linecap="round" opacity=".38"/></g>
<circle cx="420.3" cy="184" r="6" fill="#c98500" stroke="#0E1628" stroke-width="2"/>
<text x="314" y="188" class="lb" font-size="11.5" text-anchor="end">UNet-Mamba</text>
<text x="434.3" y="188" class="mono h2" font-size="11.5" fill="#c98500">34,113</text>
<g class="grow" style="animation-delay:0.24s"><line x1="330" y1="208" x2="930.7" y2="208" stroke="#199e70" stroke-width="3" stroke-linecap="round" opacity=".38"/></g>
<circle cx="930.7" cy="208" r="6" fill="#199e70" stroke="#0E1628" stroke-width="2"/>
<text x="314" y="212" class="lb" font-size="11.5" text-anchor="end">UNet-Temporal</text>
<text x="944.7" y="212" class="mono h2" font-size="11.5" fill="#199e70">698,259</text>
<line x1="420.3" y1="232" x2="930.7" y2="232" stroke="#e66767" stroke-width="1.4" stroke-dasharray="4 4" class="pp"/>
<line x1="420.3" y1="227" x2="420.3" y2="237" stroke="#e66767" stroke-width="1.4"/>
<line x1="930.7" y1="227" x2="930.7" y2="237" stroke="#e66767" stroke-width="1.4"/>
<text x="675.5" y="250" class="h2" font-size="12" fill="#e66767" text-anchor="middle">20.5× spread</text>
<text x="38" y="272" class="h2" font-size="14">Barataria Bay · Ida 2021</text>
<rect x="666.6" y="278" width="325.9" height="76" rx="8" fill="#e66767" opacity=".08"/>
<g class="grow" style="animation-delay:0.00s"><line x1="330" y1="294" x2="666.6" y2="294" stroke="#3987e5" stroke-width="3" stroke-linecap="round" opacity=".38"/></g>
<circle cx="666.6" cy="294" r="6" fill="#3987e5" stroke="#0E1628" stroke-width="2"/>
<text x="314" y="298" class="lb" font-size="11.5" text-anchor="end">EcoTransformer</text>
<text x="680.6" y="298" class="mono h2" font-size="11.5" fill="#3987e5">146,458</text>
<g class="grow" style="animation-delay:0.12s"><line x1="330" y1="318" x2="669.6" y2="318" stroke="#c98500" stroke-width="3" stroke-linecap="round" opacity=".38"/></g>
<circle cx="669.6" cy="318" r="6" fill="#c98500" stroke="#0E1628" stroke-width="2"/>
<text x="314" y="322" class="lb" font-size="11.5" text-anchor="end">UNet-Mamba</text>
<text x="683.6" y="322" class="mono h2" font-size="11.5" fill="#c98500">149,006</text>
<g class="grow" style="animation-delay:0.24s"><line x1="330" y1="342" x2="992.5" y2="342" stroke="#199e70" stroke-width="3" stroke-linecap="round" opacity=".38"/></g>
<circle cx="992.5" cy="342" r="6" fill="#199e70" stroke="#0E1628" stroke-width="2"/>
<text x="314" y="346" class="lb" font-size="11.5" text-anchor="end">UNet-Temporal</text>
<text x="1006.5" y="346" class="mono h2" font-size="11.5" fill="#199e70">1,006,257</text>
<line x1="666.6" y1="366" x2="992.5" y2="366" stroke="#e66767" stroke-width="1.4" stroke-dasharray="4 4" class="pp"/>
<line x1="666.6" y1="361" x2="666.6" y2="371" stroke="#e66767" stroke-width="1.4"/>
<line x1="992.5" y1="361" x2="992.5" y2="371" stroke="#e66767" stroke-width="1.4"/>
<text x="829.6" y="384" class="h2" font-size="12" fill="#e66767" text-anchor="middle">6.9× spread</text>
<rect x="38" y="424" width="1124" height="58" rx="10" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<circle cx="62" cy="453" r="8" fill="none" stroke="#e66767" stroke-width="1.6"/>
<text x="62" y="458" class="h2" font-size="11" fill="#e66767" text-anchor="middle">!</text>
<text x="84" y="449" class="lb" font-size="11.8">Read this as a caution, not a measurement. No damage figure from this pipeline — the best model included — has been validated.</text>
<text x="84" y="467" class="mu" font-size="11.8">The two converged models agree within ~1.5× on Barataria Bay. The diverged one does not, and it is the one driving the spread.</text>
</svg>