<line x1="484.9" y1="118" x2="484.9" y2="384" stroke="#22304F" opacity=".6"/>
<text x="484.9" y="404" class="mu mono" font-size="10" text-anchor="middle">50k</text>
<line x1="602.1" y1="118" x2="602.1" y2="384" stroke="#22304F" opacity=".6"/>
<text x="602.1" y="404" class="mu mono" font-size="10" text-anchor="middle">100k</text>
<line x1="719.3" y1="118" x2="719.3" y2="384" stroke="#22304F" opacity=".6"/>
<text x="719.3" y="404" class="mu mono" font-size="10" text-anchor="middle">200k</text>
<line x1="874.2" y1="118" x2="874.2" y2="384" stroke="#22304F" opacity=".6"/>
<text x="874.2" y="404" class="mu mono" font-size="10" text-anchor="middle">500k</text>
<line x1="991.4" y1="118" x2="991.4" y2="384" stroke="#22304F" opacity=".6"/>
<text x="991.4" y="404" class="mu mono" font-size="10" text-anchor="middle">1M</text>
<text x="38" y="138" class="h2" font-size="14">Everglades · Irma 2017</text>
