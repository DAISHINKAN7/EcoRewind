96.8 Q145 96.8 150 98.9 Q155 98.9 160 100.3 Q165 100.3 170 101.0 Q175 101.0 180 100.7 Q185 100.7 190 99.6" fill="none" stroke="#25392F" stroke-width="1" opacity="0.28"/><path d="M0 114 Q5 115.7 10 113.9 Q15 113.9 20 112.2 Q25 112.2 30 110.7 Q35 110.7 40 109.6 Q45 109.6 50 109.0 Q55 109.0 60 109.1 Q65 109.1 70 109.8 Q75 109.8 80 111.1 Q85 111.1 90 112.7 Q95 112.7 100 114.4 Q105 114.4 110 116.2 Q115 116.2 120 117.6 Q125 117.6 130 118.6 Q135 118.6 140 119.0 Q145 119.0 150 118.8 Q155 118.8 160 117.9 Q165 117.9 170 116.6 Q175 116.6 180 115.0 Q185 115.0 190 113.2" fill="none" stroke="#25392F" stroke-width="1" opacity="0.2"/></pattern>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
