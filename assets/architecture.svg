<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="EcoTransformer architecture">
<title>EcoTransformer architecture</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#0E1628"/>
</linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0F1830"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#22304F" stroke-width="1" opacity=".38"/>
</pattern>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="attn" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#9085e9" stop-opacity=".30"/><stop offset="1" stop-color="#3987e5" stop-opacity=".14"/></linearGradient>
</defs>
<style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .h1 { fill:#E8EEF9; font-weight:700; }
  .h2 { fill:#E8EEF9; font-weight:650; }
  .lb { fill:#A9BAD8; font-weight:500; }
  .mu { fill:#7286AB; font-weight:500; }
  .kicker { fill:#7286AB; font-weight:600; letter-spacing:.16em; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }

 .flow { stroke-dasharray:4 10; animation:fl 1.7s linear infinite; }
 @keyframes fl { to { stroke-dashoffset:-28; } }
 .brea { animation:br 4s ease-in-out infinite; }
 @keyframes br { 0%,100%{opacity:.30} 50%{opacity:.68} }
</style>
<rect width="1200" height="470" rx="18" fill="url(#bg)"/>
<rect width="1200" height="470" rx="18" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="469" rx="18" fill="none" stroke="#2E3F66"/>
<text x="38" y="44" class="kicker" font-size="12">BEST-PERFORMING ARCHITECTURE · models/eco_transformer.py</text>
<text x="36" y="76" class="h1" font-size="23">EcoTransformer — factorized spatiotemporal attention</text>
<text x="38" y="100" class="mu" font-size="12.5">embed_dim 128 · depth 4 · heads 8 · mlp_ratio 4.0 · dropout 0.1 — attention cost O(HW·d + T·d), not O((T·HW)²)</text>
<rect x="42" y="134" width="104" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="42" y="134" width="104" height="3" rx="1.5" fill="#3987e5"/>
<text x="94.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">INPUT</text>
<text x="94.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">(B,T,7,128,128)</text>
<text x="94.0" y="258" class="lb" font-size="8.8" text-anchor="middle" fill="#3987e5">7 bands × 4 quarters</text>
<line x1="147" y1="209.0" x2="157" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="147" y1="209.0" x2="157" y2="209.0" stroke="#3987e5" stroke-width="1.8" class="flow"/>
<rect x="158" y="134" width="110" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="158" y="134" width="110" height="3" rx="1.5" fill="#c98500"/>
<text x="213.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">SAR GATE</text>
<text x="213.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">σ(g) init ≈ 0.05</text>
<text x="213.0" y="258" class="lb" font-size="8.8" text-anchor="middle" fill="#c98500">learned suppression of</text>
<text x="213.0" y="270" class="lb" font-size="8.8" text-anchor="middle" fill="#c98500">87%-invalid SAR</text>
<line x1="269" y1="209.0" x2="279" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="269" y1="209.0" x2="279" y2="209.0" stroke="#c98500" stroke-width="1.8" class="flow"/>
<rect x="280" y="134" width="110" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="280" y="134" width="110" height="3" rx="1.5" fill="#c98500"/>
<text x="335.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">CHANNEL WT</text>
<text x="335.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">per-band weights</text>
<line x1="391" y1="209.0" x2="401" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="391" y1="209.0" x2="401" y2="209.0" stroke="#c98500" stroke-width="1.8" class="flow"/>
<rect x="402" y="134" width="110" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="402" y="134" width="110" height="3" rx="1.5" fill="#199e70"/>
<text x="457.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">PATCH EMBED</text>
<text x="457.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">2D sin pos +</text>
<text x="457.0" y="207" class="mu mono" font-size="8.8" text-anchor="middle">learned t-emb</text>
<line x1="513" y1="209.0" x2="523" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="513" y1="209.0" x2="523" y2="209.0" stroke="#199e70" stroke-width="1.8" class="flow"/>
<rect x="524" y="134" width="140" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="524" y="134" width="140" height="150" rx="12" fill="url(#attn)" class="brea"/>
<rect x="524" y="134" width="140" height="3" rx="1.5" fill="#9085e9"/>
<text x="594.0" y="164" class="h2" font-size="11.5" text-anchor="middle" letter-spacing=".04em">FACTORIZED ST</text>
<text x="594.0" y="179" class="h2" font-size="11.5" text-anchor="middle" letter-spacing=".04em">×4</text>
<text x="594.0" y="208" class="mu mono" font-size="8.8" text-anchor="middle">spatial → temporal</text>
<text x="594.0" y="222" class="mu mono" font-size="8.8" text-anchor="middle">attention</text>
<text x="594.0" y="258" class="lb" font-size="8.8" text-anchor="middle" fill="#9085e9">the core block</text>
<line x1="665" y1="209.0" x2="675" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="665" y1="209.0" x2="675" y2="209.0" stroke="#9085e9" stroke-width="1.8" class="flow"/>
<rect x="676" y="134" width="110" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="676" y="134" width="110" height="3" rx="1.5" fill="#9085e9"/>
<text x="731.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">CROSS-ATTN</text>
<text x="731.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">T_out queries</text>
<line x1="787" y1="209.0" x2="797" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="787" y1="209.0" x2="797" y2="209.0" stroke="#9085e9" stroke-width="1.8" class="flow"/>
<rect x="798" y="134" width="110" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="798" y="134" width="110" height="3" rx="1.5" fill="#199e70"/>
<text x="853.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">SSIM DECODE</text>
<text x="853.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">structural recon</text>
<line x1="909" y1="209.0" x2="919" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="909" y1="209.0" x2="919" y2="209.0" stroke="#199e70" stroke-width="1.8" class="flow"/>
<rect x="920" y="134" width="110" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="920" y="134" width="110" height="3" rx="1.5" fill="#c98500"/>
<text x="975.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">CLAMP</text>
<text x="975.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">optical [−0.1,1.1]</text>
<text x="975.0" y="207" class="mu mono" font-size="8.8" text-anchor="middle">SAR [−4,4]</text>
<text x="975.0" y="258" class="lb" font-size="8.8" text-anchor="middle" fill="#c98500">fp16-safe bounds</text>
<line x1="1031" y1="209.0" x2="1041" y2="209.0" stroke="#2E3F66" stroke-width="1.8"/>
<line x1="1031" y1="209.0" x2="1041" y2="209.0" stroke="#c98500" stroke-width="1.8" class="flow"/>
<rect x="1042" y="134" width="104" height="150" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="1042" y="134" width="104" height="3" rx="1.5" fill="#3987e5"/>
<text x="1094.0" y="164" class="h2" font-size="10.8" text-anchor="middle" letter-spacing=".04em">OUTPUT</text>
<text x="1094.0" y="193" class="mu mono" font-size="8.8" text-anchor="middle">(B,T_out,7,128,128)</text>
<text x="1094.0" y="258" class="lb" font-size="8.8" text-anchor="middle" fill="#3987e5">4 forecast quarters</text>
<rect x="38" y="308" width="1124" height="74" rx="12" fill="url(#panel)" stroke="#2E3F66" stroke-width="1"/>
<rect x="46" y="326" width="3" height="38" rx="1.5" fill="#9085e9"/>
<text x="58" y="340" class="h2" font-size="12" fill="#9085e9">Factorized attention</text>
<text x="58" y="358" class="lb" font-size="11">spatial then temporal — makes full 128×128 attention tractable</text>
<rect x="418" y="326" width="3" height="38" rx="1.5" fill="#c98500"/>
<text x="430" y="340" class="h2" font-size="12" fill="#c98500">Learned SAR gate</text>
<text x="430" y="358" class="lb" font-size="11">init σ(−3.0)≈0.05, so the 87%-fill band cannot corrupt training</text>
<rect x="790" y="326" width="3" height="38" rx="1.5" fill="#199e70"/>
<text x="802" y="340" class="h2" font-size="12" fill="#199e70">Result</text>
<text x="802" y="358" class="lb" font-size="11">NDVI R² 0.901 vs 0.177 for the ConvLSTM baseline</text>
<text x="38" y="410" class="mu" font-size="11.5">The four architectures that did not win are documented too — three of five diverged, and the reasons are in the README.</text>
</svg>