<text x="180" y="386" class="mu" font-size="10.5">ha impacted</text>
<text x="302" y="367" class="h2 mono" font-size="20" fill="#D2703A">23.7%</text>
<text x="302" y="386" class="mu" font-size="10.5">pixels damaged</text>
