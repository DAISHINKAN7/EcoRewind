<circle cx="1087.3" cy="233.8" r="3.2" fill="#e66767"/>
<circle cx="1142.0" cy="230.5" r="3.2" fill="#e66767"/>
<line x1="677.3" y1="90" x2="677.3" y2="340" stroke="#e66767" stroke-width="1.6" stroke-dasharray="5 4" opacity=".9"/>
<circle cx="677.3" cy="134" r="6" fill="#e66767" class="blip"/>
<text x="688" y="138" class="h2" font-size="11.5" fill="#e66767">Hurricane Irma · Q3 2017</text>
<line x1="486" y1="376" x2="510" y2="376" stroke="#e66767" stroke-width="2.6" stroke-linecap="round"/>
<text x="518" y="380" class="lb" font-size="11.5">observed</text>
<line x1="604.8" y1="376" x2="628.8" y2="376" stroke="#199e70" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round"/>
<text x="636.8" y="380" class="lb" font-size="11.5">counterfactual (no storm)</text>
<line x1="835.8" y1="376" x2="859.8" y2="376" stroke="#A9BAD8" stroke-width="2.6" stroke-linecap="round"/>
<text x="867.8" y="380" class="lb" font-size="11.5">pre-event context</text>
<text x="486" y="354" class="mu" font-size="10.5">2016 Q3</text>
<text x="1142" y="354" class="mu" font-size="10.5" text-anchor="end">2019 Q4</text>
</svg>