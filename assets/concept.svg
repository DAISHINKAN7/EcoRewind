<style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .h1 { fill:#EDF3EE; font-weight:700; }
  .h2 { fill:#EDF3EE; font-weight:650; }
  .lb { fill:#A8BFB0; font-weight:500; }
  .mu { fill:#74907F; font-weight:500; }
  .kicker { fill:#74907F; font-weight:600; letter-spacing:.16em; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }

 .draw { stroke-dasharray:1400; stroke-dashoffset:1400; animation:dw 3.2s ease-out forwards; }
 @keyframes dw { to { stroke-dashoffset:0; } }
 .fadein { opacity:0; animation:fi .9s ease-out 2.4s forwards; }
 @keyframes fi { to { opacity:1; } }
 .blip { animation:bp 2.6s ease-in-out infinite; }
 @keyframes bp { 0%,100%{r:5;opacity:1} 50%{r:9;opacity:.45} }
</style>
