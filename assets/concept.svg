<circle cx="759.3" cy="183.0" r="3.2" fill="#e66767"/>
<circle cx="814.0" cy="222.9" r="3.2" fill="#e66767"/>
<circle cx="868.7" cy="276.1" r="3.2" fill="#e66767"/>
<circle cx="923.3" cy="252.6" r="3.2" fill="#e66767"/>
<circle cx="978.0" cy="162.9" r="3.2" fill="#e66767"/>
