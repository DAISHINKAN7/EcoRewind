<style>
  text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
  .h1 { fill:#EDF3EE; font-weight:700; }
  .h2 { fill:#EDF3EE; font-weight:650; }
  .lb { fill:#A8BFB0; font-weight:500; }
  .mu { fill:#74907F; font-weight:500; }
  .kicker { fill:#74907F; font-weight:600; letter-spacing:.16em; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
.tk{animation:tk 4s ease-in-out infinite}@keyframes tk{0%,100%{opacity:.6}50%{opacity:1}}
</style>
<rect width="1200" height="530" rx="18" fill="url(#bg)"/>
<rect width="1200" height="530" rx="18" fill="url(#contour)"/>
<rect x=".5" y=".5" width="1199" height="529" rx="18" fill="none" stroke="#324B3E"/>
<text x="38" y="44" class="kicker" font-size="12">HONEST STATUS BOARD</text>
<text x="36" y="76" class="h1" font-size="23">What holds up, and what does not</text>
<text x="38" y="99" class="mu" font-size="12">Every item below is measured, reproducible from <tspan class="mono">outputs/metrics/</tspan>, and unresolved unless marked otherwise. Nothing here is hidden in a footnote.</text>
<rect x="38" y="124" width="362" height="336" rx="13" fill="url(#panel)" stroke="#324B3E" stroke-width="1"/>
<rect x="38" y="124" width="362" height="3" rx="1.5" fill="#3E9E52"/>
<circle cx="64" cy="155" r="5.5" fill="#3E9E52" class="tk"/>
<text x="80" y="160" class="h2" font-size="14.5" fill="#3E9E52" letter-spacing=".10em">SOLID</text>
<text x="380" y="160" class="mono mu" font-size="12" text-anchor="end">6</text>
<line x1="58" y1="172" x2="380" y2="172" stroke="#324B3E"/>
<rect x="56" y="180" width="2.5" height="30" rx="1.25" fill="#3E9E52" opacity=".55"/>
<text x="68" y="193" class="h2" font-size="11.8">Forecast skill</text>
<text x="68" y="209" class="mu" font-size="10.5">NDVI R² 0.901 · NDWI 0.917, best model</text>
<rect x="56" y="226" width="2.5" height="30" rx="1.25" fill="#3E9E52" opacity=".55"/>
<text x="68" y="239" class="h2" font-size="11.8">5 architectures</text>
<text x="68" y="255" class="mu" font-size="10.5">implemented from scratch, benchmarked</text>
<rect x="56" y="272" width="2.5" height="30" rx="1.25" fill="#3E9E52" opacity=".55"/>
<text x="68" y="285" class="h2" font-size="11.8">Domain-constrained loss</text>
<text x="68" y="301" class="mu" font-size="10.5">Charbonnier + temporal + ecological + SSIM</text>
<rect x="56" y="318" width="2.5" height="30" rx="1.25" fill="#3E9E52" opacity=".55"/>
<text x="68" y="331" class="h2" font-size="11.8">Three real bugs</text>
<text x="68" y="347" class="mu" font-size="10.5">diagnosed, root-caused, fixed</text>
<rect x="56" y="364" width="2.5" height="30" rx="1.25" fill="#3E9E52" opacity=".55"/>
<text x="68" y="377" class="h2" font-size="11.8">Rollout machinery</text>
<text x="68" y="393" class="mu" font-size="10.5">MC Dropout + climatology floor</text>
<rect x="56" y="410" width="2.5" height="30" rx="1.25" fill="#3E9E52" opacity=".55"/>
<text x="68" y="423" class="h2" font-size="11.8">Data engineering</text>
<text x="68" y="439" class="mu" font-size="10.5">7 bands · 32 quarters · validity masks</text>
<rect x="419" y="124" width="362" height="336" rx="13" fill="url(#panel)" stroke="#324B3E" stroke-width="1"/>
<rect x="419" y="124" width="362" height="3" rx="1.5" fill="#B8891F"/>
<circle cx="445" cy="155" r="5.5" fill="#B8891F" class="tk"/>
<text x="461" y="160" class="h2" font-size="14.5" fill="#B8891F" letter-spacing=".10em">SHAKY</text>
<text x="761" y="160" class="mono mu" font-size="12" text-anchor="end">6</text>
<line x1="439" y1="172" x2="761" y2="172" stroke="#324B3E"/>
<rect x="437" y="180" width="2.5" height="30" rx="1.25" fill="#B8891F" opacity=".55"/>
<text x="449" y="193" class="h2" font-size="11.8">Spatial leakage</text>
<text x="449" y="209" class="mu" font-size="10.5">stride 64 on 128 px patches — R² is an upper bound</text>
<rect x="437" y="226" width="2.5" height="30" rx="1.25" fill="#B8891F" opacity=".55"/>
<text x="449" y="239" class="h2" font-size="11.8">No test set</text>
<text x="449" y="255" class="mu" font-size="10.5">val split does early stopping AND reporting</text>
<rect x="437" y="272" width="2.5" height="30" rx="1.25" fill="#B8891F" opacity=".55"/>
<text x="449" y="285" class="h2" font-size="11.8">SAR unusable</text>
<text x="449" y="301" class="mu" font-size="10.5">negative R² everywhere · 87% zero fill</text>
<rect x="437" y="318" width="2.5" height="30" rx="1.25" fill="#B8891F" opacity=".55"/>
<text x="449" y="331" class="h2" font-size="11.8">Carbon proxy</text>
<text x="449" y="347" class="mu" font-size="10.5">one global 85 tCO₂ constant for all land cover</text>
<rect x="437" y="364" width="2.5" height="30" rx="1.25" fill="#B8891F" opacity=".55"/>
<text x="449" y="377" class="h2" font-size="11.8">Convergence metric</text>
<text x="449" y="393" class="mu" font-size="10.5">assumes monotone recovery; data oscillates</text>
<rect x="437" y="410" width="2.5" height="30" rx="1.25" fill="#B8891F" opacity=".55"/>
<text x="449" y="423" class="h2" font-size="11.8">Metrics provenance</text>
<text x="449" y="439" class="mu" font-size="10.5">one file overwritten under the wrong model name</text>
<rect x="800" y="124" width="362" height="336" rx="13" fill="url(#panel)" stroke="#324B3E" stroke-width="1"/>
<rect x="800" y="124" width="362" height="3" rx="1.5" fill="#C4553F"/>
<circle cx="826" cy="155" r="5.5" fill="#C4553F" class="tk"/>
<text x="842" y="160" class="h2" font-size="14.5" fill="#C4553F" letter-spacing=".10em">BROKEN</text>
<text x="1142" y="160" class="mono mu" font-size="12" text-anchor="end">6</text>
<line x1="820" y1="172" x2="1142" y2="172" stroke="#324B3E"/>
<rect x="818" y="180" width="2.5" height="30" rx="1.25" fill="#C4553F" opacity=".55"/>
<text x="830" y="193" class="h2" font-size="11.8">Counterfactual unvalidated</text>
<text x="830" y="209" class="mu" font-size="10.5">no placebo test exists — the central gap</text>
<rect x="818" y="226" width="2.5" height="30" rx="1.25" fill="#C4553F" opacity=".55"/>
<text x="830" y="239" class="h2" font-size="11.8">Attribution is architecture-bound</text>
<text x="830" y="255" class="mu" font-size="10.5">carbon loss varies &gt;20× across backbones</text>
<rect x="818" y="272" width="2.5" height="30" rx="1.25" fill="#C4553F" opacity=".55"/>
<text x="830" y="285" class="h2" font-size="11.8">3 of 5 models diverged</text>
<text x="830" y="301" class="mu" font-size="10.5">UNet-Temporal NaN · Mamba −3.5 · PatchTST −7.4</text>
<rect x="818" y="318" width="2.5" height="30" rx="1.25" fill="#C4553F" opacity=".55"/>
<text x="830" y="331" class="h2" font-size="11.8">Ablation harness</text>
<text x="830" y="347" class="mu" font-size="10.5">4 of 6 configs crash on channel mismatch</text>
<rect x="818" y="364" width="2.5" height="30" rx="1.25" fill="#C4553F" opacity=".55"/>
<text x="830" y="377" class="h2" font-size="11.8">MC-Dropout uncalibrated</text>
<text x="830" y="393" class="mu" font-size="10.5">bands span ±2.5 NDVI — physically impossible</text>
<rect x="818" y="410" width="2.5" height="30" rx="1.25" fill="#C4553F" opacity=".55"/>
<text x="830" y="423" class="h2" font-size="11.8">Reproducibility</text>
<text x="830" y="439" class="mu" font-size="10.5">GEE export uncommitted · hardcoded paths · no tests</text>
<rect x="38" y="474" width="1124" height="0" rx="0" fill="url(#panel)" stroke="#324B3E" stroke-width="1"/>
<line x1="38" y1="478" x2="1162" y2="478" stroke="#324B3E" stroke-dasharray="3 6"/>
<text x="38" y="499" class="lb" font-size="11.8">Top of the roadmap is the placebo test: roll the counterfactual across a quiet, non-hurricane window and score it against what actually happened.</text>
<text x="38" y="517" class="mu" font-size="11.8">That one experiment moves the first item of column three into column one — and it is the difference between a demo and a result.</text>
</svg>